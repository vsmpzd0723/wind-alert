<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wind Alert</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #eef5f9;
      font-family: Arial, sans-serif;
      color: #17324d;
    }

    .header {
      background: #0077b6;
      color: white;
      text-align: center;
      padding: 18px 10px;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
    }

    .header p {
      margin: 7px 0 0;
      font-size: 14px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin: 0 0 5px;
      font-size: 21px;
    }

    .card p {
      margin: 0 0 15px;
      color: #60788c;
      font-size: 14px;
    }

    .forecast {
      width: 100%;
      min-height: 600px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🌬️ Wind Alert</h1>
    <p>Прогноз для wingfoil</p>
  </div>

  <div class="container">

    <div class="card">

      <h2>Щёлкино · Татарка · Казантип</h2>

      <p>Windy.app — прогноз ветра</p>

      <div
        class="forecast"
        data-windywidget="forecast"
        data-thememode="white"
        data-responsive="true"
        data-spotid="206895"
        data-appid="f703bd89da5575c8eed6c88aa5faed08">
      </div>

      <script
        async
        data-cfasync="false"
        type="text/javascript"
        src="https://windy.app/widgets-code/forecast/windy_forecast_async.js">
      </script>

    </div>

  </div>

</body>
</html>
