<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wind Alert — Wingfoil Крым</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "Segoe UI", Arial, sans-serif;
      background: linear-gradient(
        180deg,
        #dff5ff 0%,
        #f5fbff 45%,
        #edf5f8 100%
      );
      color: #102a43;
    }

    .app {
      max-width: 620px;
      margin: 0 auto;
      padding: 15px;
    }

    header {
      text-align: center;
      padding: 15px 10px 20px;
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 10px;
      border-radius: 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 38px;

      background: linear-gradient(
        135deg,
        #008cff,
        #0066ff
      );

      box-shadow: 0 10px 25px rgba(0, 120, 255, 0.25);
    }

    h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 4px;
      color: #607d95;
      font-size: 15px;
    }

    .card {
      background: rgba(255,255,255,0.94);
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 15px;

      box-shadow: 0 8px 25px rgba(40, 100, 130, 0.08);
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    select {
      width: 100%;
      padding: 15px;

      border: 1px solid #d7e7f0;
      border-radius: 15px;

      background: #f8fcff;

      font-size: 16px;
      color: #102a43;

      outline: none;
    }

    .button {
      display: block;
      width: 100%;

      margin-top: 12px;
      padding: 15px;

      border-radius: 15px;

      text-align: center;
      text-decoration: none;

      color: white;
      font-size: 16px;
      font-weight: 700;

      background: linear-gradient(
        135deg,
        #008cff,
        #0066ff
      );

      box-shadow: 0 8px 18px rgba(0, 110, 255, 0.22);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-icon {
      width: 46px;
      height: 46px;

      border-radius: 14px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #e8f5ff;

      font-size: 24px;
    }

    .status-title {
      font-weight: 700;
      font-size: 16px;
    }

    .status-text {
      margin-top: 3px;
      font-size: 13px;
      color: #71879a;
    }

    .forecast-card {
      padding: 10px;
      overflow: hidden;
    }

    .forecast {
      width: 100%;
    }

    .hidden {
      display: none;
    }

    .info {
      font-size: 13px;
      line-height: 1.5;
      color: #607d95;
    }

    .info strong {
      color: #29465d;
    }

    footer {
      text-align: center;
      padding: 10px 0 25px;

      color: #7890a2;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>

    <div class="logo">
      🌬️
    </div>

    <h1>Wind Alert</h1>

    <div class="subtitle">
      Wingfoil · Крым
    </div>

  </header>


  <!-- ВЫБОР СПОТА -->

  <div class="card">

    <div class="card-title">
      📍 Выбери спот
    </div>

    <select id="spotSelect">

      <option value="206895">
        Щёлкино · Татарка · Казантип
      </option>

      <option value="8746">
        Оленевка
      </option>

      <option value="5329437">
        Донузлав
      </option>

      <option value="379119">
        Межводное · Kitepleasure
      </option>

      <option value="561722">
        Севастополь
      </option>

    </select>


    <a
      id="openForecast"
      class="button"
      href="https://windy.app/forecast2/spot/206895/"
      target="_blank"
    >
      Открыть прогноз в Windy.app
    </a>

  </div>


  <!-- ИНФОРМАЦИЯ -->

  <div class="card">

    <div class="status">

      <div class="status-icon">
        🌊
      </div>

      <div>

        <div class="status-title" id="selectedSpot">
          Щёлкино · Татарка · Казантип
        </div>

        <div class="status-text">
          Актуальный прогноз Windy.app
        </div>

      </div>

    </div>

  </div>


  <!-- ПРОГНОЗЫ -->

  <div class="card forecast-card">


    <!-- ЩЁЛКИНО -->

    <div
      id="forecast-206895"
      class="forecast"
    >

      <div
        data-windywidget="forecast"
        data-thememode="white"
        data-responsive="true"
        data-spotid="206895"
        data-appid="f703bd89da5575c8eed6c88aa5faed08">
      </div>

    </div>


    <!-- ОЛЕНЕВКА -->

    <div
      id="forecast-8746"
      class="forecast hidden"
    >

      <div
        data-windywidget="forecast"
        data-thememode="white"
        data-responsive="true"
        data-spotid="8746"
        data-appid="f703bd89da5575c8eed6c88aa5faed08">
      </div>

    </div>


    <!-- ДОНУЗЛАВ -->

    <div
      id="forecast-5329437"
      class="forecast hidden"
    >

      <div
        data-windywidget="forecast"
        data-thememode="white"
        data-responsive="true"
        data-spotid="5329437"
        data-appid="f703bd89da5575c8eed6c88aa5faed08">
      </div>

    </div>


    <!-- МЕЖВОДНОЕ -->

    <div
      id="forecast-379119"
      class="forecast hidden"
    >

      <div
        data-windywidget="forecast"
        data-thememode="white"
        data-responsive="true"
        data-spotid="379119"
        data-appid="f703bd89da5575c8eed6c88aa5faed08">
      </div>

    </div>


    <!-- СЕВАСТОПОЛЬ -->

    <div
      id="forecast-561722"
      class="forecast hidden"
    >

      <div
        data-windywidget="forecast"
        data-thememode="white"
        data-responsive="true"
        data-spotid="561722"
        data-appid="f703bd89da5575c8eed6c88aa5faed08">
      </div>

    </div>

  </div>


  <!-- ПОДСКАЗКА -->

  <div class="card info">

    <strong>Ориентир для wingfoil:</strong><br><br>

    4–5 м/с — слабый ветер<br>
    5–7 м/с — рабочие условия<br>
    7+ м/с — сильный ветер

  </div>


  <footer>
    Wind Alert · прогноз Windy.app
  </footer>

</div>


<!-- WINDY.APP SCRIPT -->

<script
  async
  type="text/javascript"
  src="https://windy.app/widgets-code/forecast/windy_forecast_async.js">
</script>


<script>

  const select =
    document.getElementById("spotSelect");

  const button =
    document.getElementById("openForecast");

  const title =
    document.getElementById("selectedSpot");


  const spots = {

    "206895": {
      name: "Щёлкино · Татарка · Казантип",
      url: "https://windy.app/forecast2/spot/206895/"
    },

    "8746": {
      name: "Оленевка",
      url: "https://windy.app/forecast2/spot/8746/"
    },

    "5329437": {
      name: "Донузлав",
      url: "https://windy.app/forecast2/spot/5329437/"
    },

    "379119": {
      name: "Межводное · Kitepleasure",
      url: "https://windy.app/forecast2/spot/379119/"
    },

    "561722": {
      name: "Севастополь",
      url: "https://windy.app/forecast2/spot/561722/"
    }

  };


  function showSpot(spotId) {

    /* Скрываем все прогнозы */

    document
      .querySelectorAll(".forecast")
      .forEach(function(item) {

        item.classList.add("hidden");

      });


    /* Показываем выбранный */

    const selected =
      document.getElementById(
        "forecast-" + spotId
      );


    if (selected) {

      selected.classList.remove("hidden");

    }


    /* Меняем название */

    title.textContent =
      spots[spotId].name;


    /* Меняем кнопку */

    button.href =
      spots[spotId].url;

  }


  select.addEventListener(
    "change",
    function() {

      showSpot(this.value);

    }
  );


  /* Первый спот */

  showSpot("206895");

</script>

</body>
</html>
