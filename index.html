<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
  >

  <title>Wind Alert</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">

  <meta name="theme-color" content="#087cf5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Wind Alert">

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: #eef6fc;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Arial,
        sans-serif;

      color: #12253a;

      background:
        radial-gradient(
          circle at 15% 0%,
          #d9f1ff 0%,
          transparent 32%
        ),
        linear-gradient(
          180deg,
          #f4f9fd 0%,
          #eaf3f9 100%
        );
    }

    .app {
      width: 100%;
      max-width: 620px;

      margin: 0 auto;

      padding:
        calc(14px + env(safe-area-inset-top))
        14px
        calc(100px + env(safe-area-inset-bottom));
    }

    /* =========================
       HEADER
       ========================= */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .logo {
      width: 46px;
      height: 46px;

      border-radius: 15px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 24px;

      background:
        linear-gradient(
          135deg,
          #087cf5,
          #00b9ff
        );

      box-shadow:
        0 8px 22px
        rgba(8,124,245,.25);
    }

    .brand-title {
      font-size: 21px;
      font-weight: 800;
      line-height: 1.1;
    }

    .brand-subtitle {
      margin-top: 3px;

      font-size: 12px;

      color: #718398;
    }

    .live {
      display: flex;
      align-items: center;
      gap: 7px;

      padding: 8px 11px;

      border-radius: 20px;

      background: rgba(255,255,255,.82);

      box-shadow:
        0 5px 18px
        rgba(30,70,100,.08);

      font-size: 10px;
      font-weight: 800;

      color: #63768a;
    }

    .live-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #20c878;

      box-shadow:
        0 0 0 4px
        rgba(32,200,120,.12);
    }

    /* =========================
       SPOT SELECTOR
       ========================= */

    .spot-card {
      background: rgba(255,255,255,.94);

      border-radius: 23px;

      padding: 14px;

      margin-bottom: 16px;

      box-shadow:
        0 10px 30px
        rgba(30,70,100,.08);
    }

    .spot-top {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .spot-icon {
      width: 44px;
      height: 44px;

      flex: 0 0 44px;

      border-radius: 14px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          145deg,
          #eaf7ff,
          #d9efff
        );

      font-size: 21px;
    }

    .select-wrap {
      position: relative;
      flex: 1;

      min-width: 0;
    }

    .spot-label {
      margin-bottom: 4px;

      font-size: 11px;

      color: #8494a5;
    }

    select {
      width: 100%;

      padding: 0 25px 0 0;

      border: 0;
      outline: 0;

      appearance: none;
      -webkit-appearance: none;

      background: transparent;

      color: #142b42;

      font-family: inherit;

      font-size: 16px;
      font-weight: 800;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .select-arrow {
      position: absolute;

      right: 2px;
      bottom: 1px;

      color: #7b8d9f;

      font-size: 18px;

      pointer-events: none;
    }

    /* =========================
       FORECAST HEADER
       ========================= */

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin:
        20px
        2px
        12px;
    }

    .section-title h2 {
      margin: 0;

      font-size: 21px;
      font-weight: 850;
    }

    .section-title span {
      padding: 6px 9px;

      border-radius: 10px;

      background: rgba(255,255,255,.72);

      color: #7d8fa0;

      font-size: 10px;
      font-weight: 700;
    }

    /* =========================
       FORECAST CONTAINER
       ========================= */

    .forecast-wrapper {
      position: relative;

      width: 100%;

      background: white;

      border-radius: 24px;

      overflow: hidden;

      box-shadow:
        0 12px 32px
        rgba(30,70,100,.10);
    }

    .forecast {
      display: none;

      width: 100%;

      min-height: 300px;

      background: white;
    }

    .forecast.active {
      display: block;
    }

    /* =========================
       OPEN FORECAST BUTTON
       ========================= */

    .open-button {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;

      min-height: 50px;

      margin-top: 14px;

      border-radius: 16px;

      background:
        linear-gradient(
          135deg,
          #087cf5,
          #0067dc
        );

      color: white;

      text-decoration: none;

      font-size: 14px;
      font-weight: 800;

      box-shadow:
        0 9px 22px
        rgba(8,124,245,.22);
    }

    .open-button:active {
      transform: scale(.98);
    }

    /* =========================
       INFO
       ========================= */

    .info-card {
      margin-top: 16px;

      padding: 17px;

      border-radius: 21px;

      background:
        rgba(255,255,255,.78);

      box-shadow:
        0 8px 25px
        rgba(30,70,100,.06);
    }

    .info-title {
      margin-bottom: 6px;

      font-size: 14px;
      font-weight: 800;
    }

    .info-text {
      color: #718397;

      font-size: 12px;

      line-height: 1.5;
    }

    /* =========================
       BOTTOM NAV
       ========================= */

    .bottom-nav {
      position: fixed;

      left: 50%;
      bottom: calc(9px + env(safe-area-inset-bottom));

      transform: translateX(-50%);

      width: calc(100% - 28px);
      max-width: 590px;

      height: 66px;

      padding: 4px;

      display: flex;
      align-items: center;
      justify-content: space-around;

      z-index: 100;

      border:
        1px solid
        rgba(220,230,238,.9);

      border-radius: 23px;

      background:
        rgba(255,255,255,.92);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 12px 35px
        rgba(25,55,80,.16);
    }

    .nav-item {
      width: 33.333%;

      height: 58px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 3px;

      border-radius: 18px;

      text-decoration: none;

      color: #8494a5;

      font-size: 10px;
      font-weight: 750;
    }

    .nav-icon {
      font-size: 20px;
      line-height: 21px;
    }

    .nav-item.active {
      color: #087cf5;

      background:
        rgba(8,124,245,.08);
    }

    /* =========================
       SMALL IPHONE
       ========================= */

    @media (max-width: 380px) {

      .app {
        padding-left: 10px;
        padding-right: 10px;
      }

      .brand-title {
        font-size: 19px;
      }

      .spot-card {
        border-radius: 20px;
      }

      .section-title h2 {
        font-size: 19px;
      }

    }

  </style>
</head>


<body>

  <main class="app">

    <!-- HEADER -->

    <header class="header">

      <div class="brand">

        <div class="logo">
          🌬️
        </div>

        <div>

          <div class="brand-title">
            Wind Alert
          </div>

          <div class="brand-subtitle">
            Ветер и погода
          </div>

        </div>

      </div>

      <div class="live">

        <span class="live-dot"></span>

        LIVE

      </div>

    </header>


    <!-- SPOT -->

    <section class="spot-card">

      <div class="spot-top">

        <div class="spot-icon">
          🌊
        </div>

        <div class="select-wrap">

          <div class="spot-label">
            Выберите спот
          </div>

          <select id="spotSelect">

            <option value="206895">
              Щёлкино · Татарка · Казантип
            </option>

            <option value="8746">
              Оленевка
            </option>

            <option value="5329437">
              Донузлав
            </option>

            <option value="379119">
              Межводное · Kitepleasure
            </option>

            <option value="561722">
              Севастополь
            </option>

          </select>

          <span class="select-arrow">
            ⌄
          </span>

        </div>

      </div>

    </section>


    <!-- FORECAST TITLE -->

    <div class="section-title">

      <h2>
        Прогноз
      </h2>

      <span>
        Windy.app
      </span>

    </div>


    <!-- FORECAST -->

    <section class="forecast-wrapper">


      <!-- ЩЁЛКИНО -->

      <div
        id="forecast-206895"
        class="forecast active"
      >

        <div
          data-windywidget="forecast"
          data-thememode="white"
          data-responsive="true"
          data-spotid="206895"
          data-appid="f703bd89da5575c8eed6c88aa5faed08">
        </div>

      </div>


      <!-- ОЛЕНЕВКА -->

      <div
        id="forecast-8746"
        class="forecast"
      >

        <div
          data-windywidget="forecast"
          data-thememode="white"
          data-responsive="true"
          data-spotid="8746"
          data-appid="f703bd89da5575c8eed6c88aa5faed08">
        </div>

      </div>


      <!-- ДОНУЗЛАВ -->

      <div
        id="forecast-5329437"
        class="forecast"
      >

        <div
          data-windywidget="forecast"
          data-thememode="white"
          data-responsive="true"
          data-spotid="5329437"
          data-appid="f703bd89da5575c8eed6c88aa5faed08">
        </div>

      </div>


      <!-- МЕЖВОДНОЕ -->

      <div
        id="forecast-379119"
        class="forecast"
      >

        <div
          data-windywidget="forecast"
          data-thememode="white"
          data-responsive="true"
          data-spotid="379119"
          data-appid="f703bd89da5575c8eed6c88aa5faed08">
        </div>

      </div>


      <!-- СЕВАСТОПОЛЬ -->

      <div
        id="forecast-561722"
        class="forecast"
      >

        <div
          data-windywidget="forecast"
          data-thememode="white"
          data-responsive="true"
          data-spotid="561722"
          data-appid="f703bd89da5575c8eed6c88aa5faed08">
        </div>

      </div>

    </section>


    <!-- OPEN FULL FORECAST -->

    <a
      id="openForecast"
      class="open-button"
      href="https://windy.app/forecast2/spot/206895/"
      target="_blank"
      rel="noopener"
    >
      Открыть полный прогноз ↗
    </a>


    <!-- INFO -->

    <section class="info-card">

      <div class="info-title">
        Wind Alert
      </div>

      <div class="info-text">
        Быстрый просмотр прогноза ветра
        для выбранного спота.
      </div>

    </section>

  </main>


  <!-- BOTTOM NAV -->

  <nav class="bottom-nav">

    <a
      href="#"
      class="nav-item active"
    >

      <span class="nav-icon">
        🌊
      </span>

      <span>
        Споты
      </span>

    </a>


    <a
      href="#"
      class="nav-item"
    >

      <span class="nav-icon">
        💨
      </span>

      <span>
        Ветер
      </span>

    </a>


    <a
      href="#"
      class="nav-item"
    >

      <span class="nav-icon">
        📅
      </span>

      <span>
        Прогноз
      </span>

    </a>

  </nav>


  <!-- WINDY.APP FORECAST SCRIPT -->

  <script
    async
    type="text/javascript"
    src="https://windy.app/widgets-code/forecast/windy_forecast_async.js">
  </script>


  <!-- PWA SERVICE WORKER -->

  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        function () {

          navigator.serviceWorker
            .register("./sw.js")
            .then(function () {

              console.log(
                "Wind Alert: Service Worker OK"
              );

            })
            .catch(function (error) {

              console.log(
                "Wind Alert: Service Worker error",
                error
              );

            });

        }
      );

    }

  </script>


  <!-- SPOT SWITCHING -->

  <script>

    const spots = {

      "206895": {
        name:
          "Щёлкино · Татарка · Казантип",

        url:
          "https://windy.app/forecast2/spot/206895/"
      },

      "8746": {
        name:
          "Оленевка",

        url:
          "https://windy.app/forecast2/spot/8746/"
      },

      "5329437": {
        name:
          "Донузлав",

        url:
          "https://windy.app/forecast2/spot/5329437/"
      },

      "379119": {
        name:
          "Межводное · Kitepleasure",

        url:
          "https://windy.app/forecast2/spot/379119/"
      },

      "561722": {
        name:
          "Севастополь",

        url:
          "https://windy.app/forecast2/spot/561722/"
      }

    };


    const select =
      document.getElementById(
        "spotSelect"
      );


    const openForecast =
      document.getElementById(
        "openForecast"
      );


    function showSpot(spotId) {

      document
        .querySelectorAll(".forecast")
        .forEach(
          function (forecast) {

            forecast.classList.remove(
              "active"
            );

          }
        );


      const selected =
        document.getElementById(
          "forecast-" + spotId
        );


      if (selected) {

        selected.classList.add(
          "active"
        );

      }


      if (spots[spotId]) {

        openForecast.href =
          spots[spotId].url;

      }

    }


    select.addEventListener(
      "change",
      function () {

        showSpot(this.value);

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      }
    );


    showSpot("206895");

  </script>

</body>
</html>
