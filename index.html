<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wind Alert — Wingfoil Крым</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "Segoe UI", Arial, sans-serif;
      background: linear-gradient(
        180deg,
        #dff5ff 0%,
        #f5fbff 45%,
        #edf5f8 100%
      );
      color: #102a43;
    }

    .app {
      max-width: 620px;
      margin: 0 auto;
      padding: 15px;
    }

    /* HEADER */

    header {
      text-align: center;
      padding: 15px 10px 20px;
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 10px;
      border-radius: 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 38px;

      background: linear-gradient(
        135deg,
        #008cff,
        #0066ff
      );

      box-shadow:
        0 10px 25px rgba(0, 120, 255, 0.25);
    }

    h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .subtitle {
      margin-top: 4px;
      color: #607d95;
      font-size: 15px;
    }

    /* CARD */

    .card {
      background: rgba(255,255,255,0.94);
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 15px;

      box-shadow:
        0 8px 25px rgba(40, 100, 130, 0.08);
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    /* SELECT */

    select {
      width: 100%;
      padding: 15px;

      border: 1px solid #d7e7f0;
      border-radius: 15px;

      background: #f8fcff;

      font-size: 16px;
      color: #102a43;

      outline: none;
      appearance: auto;
    }

    /* BUTTON */

    .button {
      display: block;
      width: 100%;

      margin-top: 12px;
      padding: 15px;

      border-radius: 15px;

      text-align: center;
      text-decoration: none;

      color: white;
      font-size: 16px;
      font-weight: 700;

      background: linear-gradient(
        135deg,
        #008cff,
        #0066ff
      );

      box-shadow:
        0 8px 18px rgba(0, 110, 255, 0.22);
    }

    /* STATUS */

    .status {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-icon {
      width: 46px;
      height: 46px;

      border-radius: 14px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #e8f5ff;

      font-size: 24px;
    }

    .status-title {
      font-weight: 700;
      font-size: 16px;
    }

    .status-text {
      margin-top: 3px;
      font-size: 13px;
      color: #71879a;
    }

    /* FORECAST */

    .forecast-card {
      padding: 10px;
      overflow: hidden;
    }

    #forecastContainer {
      width: 100%;
      min-height: 300px;
    }

    /* INFO */

    .info {
      font-size: 13px;
      line-height: 1.5;
      color: #607d95;
    }

    .info strong {
      color: #29465d;
    }

    /* FOOTER */

    footer {
      text-align: center;
      padding: 10px 0 25px;

      color: #7890a2;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header>

    <div class="logo">
      🌬️
    </div>

    <h1>Wind Alert</h1>

    <div class="subtitle">
      Wingfoil · Крым
    </div>

  </header>


  <!-- SPOT SELECT -->

  <div class="card">

    <div class="card-title">
      📍 Выбери спот
    </div>

    <select id="spotSelect">

      <option value="206895">
        Щёлкино · Татарка · Казантип
      </option>

      <option value="8746">
        Оленевка
      </option>

      <option value="5329437">
        Донузлав
      </option>

      <option value="379119">
        Межводное · Kitepleasure
      </option>

      <option value="561722">
        Севастополь
      </option>

    </select>

    <a
      id="openForecast"
      class="button"
      href="https://windy.app/forecast2/spot/206895/"
      target="_blank"
    >
      Открыть прогноз в Windy.app
    </a>

  </div>


  <!-- STATUS -->

  <div class="card">

    <div class="status">

      <div class="status-icon">
        🌊
      </div>

      <div>

        <div class="status-title">
          Прогноз для wingfoil
        </div>

        <div class="status-text">
          Ниже — актуальный прогноз выбранного спота
        </div>

      </div>

    </div>

  </div>


  <!-- REAL WINDY.APP FORECAST -->

  <div class="card forecast-card">

    <div id="forecastContainer"></div>

  </div>


  <!-- INFO -->

  <div class="card info">

    <strong>Ориентир для wingfoil:</strong><br><br>

    4–5 м/с — слабый ветер<br>
    5–7 м/с — рабочие условия<br>
    7+ м/с — сильный ветер

  </div>


  <footer>
    Wind Alert · прогноз Windy.app
  </footer>

</div>


<script>

  /* ================================
     СПОТЫ
  ================================= */

  const spots = {

    "206895": {
      name: "Щёлкино · Татарка · Казантип",
      url: "https://windy.app/forecast2/spot/206895/"
    },

    "8746": {
      name: "Оленевка",
      url: "https://windy.app/forecast2/spot/8746/"
    },

    "5329437": {
      name: "Донузлав",
      url: "https://windy.app/forecast2/spot/5329437/"
    },

    "379119": {
      name: "Межводное · Kitepleasure",
      url: "https://windy.app/forecast2/spot/379119/"
    },

    "561722": {
      name: "Севастополь",
      url: "https://windy.app/forecast2/spot/561722/"
    }

  };


  /* ================================
     ПОЛУЧАЕМ ВЫБРАННЫЙ СПОТ
  ================================= */

  const params = new URLSearchParams(
    window.location.search
  );

  let spotId = params.get("spot");


  /* Если такого спота нет —
     открываем Щёлкино */

  if (!spots[spotId]) {
    spotId = "206895";
  }


  /* ================================
     УСТАНАВЛИВАЕМ SELECT
  ================================= */

  const select =
    document.getElementById("spotSelect");

  select.value = spotId;


  /* ================================
     КНОПКА WINDY.APP
  ================================= */

  const button =
    document.getElementById("openForecast");

  button.href = spots[spotId].url;


  /* ================================
     СОЗДАЁМ WINDY.APP WIDGET
  ================================= */

  const container =
    document.getElementById("forecastContainer");


  const forecast =
    document.createElement("div");


  forecast.setAttribute(
    "data-windywidget",
    "forecast"
  );

  forecast.setAttribute(
    "data-thememode",
    "white"
  );

  forecast.setAttribute(
    "data-responsive",
    "true"
  );

  forecast.setAttribute(
    "data-spotid",
    spotId
  );

  forecast.setAttribute(
    "data-appid",
    "f703bd89da5575c8eed6c88aa5faed08"
  );


  container.appendChild(forecast);


  /* ================================
     ЗАГРУЖАЕМ WINDY.APP SCRIPT
  ================================= */

  const script =
    document.createElement("script");

  script.async = true;

  script.type =
    "text/javascript";

  script.src =
    "https://windy.app/widgets-code/forecast/windy_forecast_async.js";


  document.body.appendChild(script);


  /* ================================
     ПЕРЕКЛЮЧЕНИЕ СПОТА
  ================================= */

  select.addEventListener(
    "change",
    function () {

      const newSpot =
        this.value;

      window.location.href =
        window.location.pathname +
        "?spot=" +
        newSpot;

    }
  );

</script>

</body>
</html>
