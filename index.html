<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wind Alert — Крым</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      background: #eef5f9;
      color: #17324d;
    }

    .header {
      background: #0077b6;
      color: white;
      text-align: center;
      padding: 24px 15px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 7px 0 0;
      font-size: 14px;
      opacity: .9;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px 15px;
    }

    .label {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 9px;
    }

    select {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 13px;
      background: white;
      color: #17324d;
      font-size: 16px;
      box-shadow: 0 2px 9px rgba(0,0,0,.08);
      outline: none;
    }

    .spot-card {
      background: white;
      border-radius: 16px;
      margin-top: 18px;
      padding: 18px;
      box-shadow: 0 2px 9px rgba(0,0,0,.08);
    }

    .spot-name {
      font-size: 20px;
      font-weight: 700;
    }

    .spot-location {
      margin-top: 5px;
      color: #718596;
      font-size: 14px;
    }

    .button {
      display: block;
      width: 100%;
      margin-top: 17px;
      padding: 14px;
      border-radius: 11px;
      background: #0077b6;
      color: white;
      text-decoration: none;
      text-align: center;
      font-weight: 600;
      font-size: 15px;
    }

    .button:active {
      transform: scale(.98);
    }

    .hint {
      text-align: center;
      color: #8193a1;
      font-size: 12px;
      margin-top: 20px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<header class="header">
  <h1>🌬️ WIND ALERT</h1>
  <p>Крым · Wingfoil</p>
</header>

<main class="container">

  <div class="label">Выберите спот</div>

  <select id="spotSelect">

    <option value="206895"
            data-name="Щёлкино · Татарка · Казантип"
            data-location="Азовское море"
            data-url="https://windy.app/forecast2/spot/206895/">
      Щёлкино · Татарка · Казантип
    </option>

    <option value="8746"
            data-name="Оленевка"
            data-location="Тарханкут · Чёрное море"
            data-url="https://windy.app/forecast2/spot/8746/">
      Оленевка
    </option>

    <option value="5329437"
            data-name="Донузлав"
            data-location="Чёрное море"
            data-url="https://windy.app/forecast2/spot/5329437/">
      Донузлав
    </option>

    <option value="379119"
            data-name="Межводное · Kitepleasure"
            data-location="Тарханкут · Чёрное море"
            data-url="https://windy.app/forecast2/spot/379119/">
      Межводное · Kitepleasure
    </option>

    <option value="561722"
            data-name="Севастополь"
            data-location="Чёрное море"
            data-url="https://windy.app/forecast2/spot/561722/">
      Севастополь
    </option>

    <option value="813205"
            data-name="Коктебель"
            data-location="Юго-восточный Крым"
            data-url="https://windy.app/forecast2/spot/813205/">
      Коктебель
    </option>

    <option value="5111979"
            data-name="Судак"
            data-location="Юго-восточный Крым"
            data-url="https://windy.app/forecast2/spot/5111979/">
      Судак
    </option>

  </select>

  <div class="spot-card">

    <div class="spot-name" id="spotName">
      Щёлкино · Татарка · Казантип
    </div>

    <div class="spot-location" id="spotLocation">
      Азовское море
    </div>

    <a
      id="forecastButton"
      class="button"
      href="https://windy.app/forecast2/spot/206895/"
      target="_blank">
      🌬️ Открыть прогноз Windy.app
    </a>

  </div>

  <div class="hint">
    Выберите нужный спот — кнопка автоматически изменится
    на его прогноз Windy.app.
  </div>

</main>

<script>

  const select = document.getElementById("spotSelect");
  const name = document.getElementById("spotName");
  const location = document.getElementById("spotLocation");
  const button = document.getElementById("forecastButton");

  select.addEventListener("change", function() {

    const option = this.options[this.selectedIndex];

    name.textContent = option.dataset.name;
    location.textContent = option.dataset.location;
    button.href = option.dataset.url;

  });

</script>

</body>
</html>
