<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wind Alert</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef5f9;
    }

    .header {
      background: #0077b6;
      color: white;
      text-align: center;
      padding: 18px;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
    }

    .header p {
      margin: 6px 0 0;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .card h2 {
      margin-top: 0;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🌬️ Wind Alert</h1>
    <p>Прогноз для wingfoil</p>
  </div>

  <div class="container">

    <div class="card">

      <h2>Щёлкино · Татарка · Казантип</h2>

      <div
        data-windywidget="map"
        data-spotid="206895"
        data-appid="f703bd89da5575c8eed6c88aa5faed08"
        data-spots="true">
      </div>

      <script
        async="true"
        data-cfasync="false"
        type="text/javascript"
        src="https://windy.app/widgets-code/map/windy_map_async.js">
      </script>

    </div>

  </div>

</body>
</html>
