<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wind Alert</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#eef5f8;
  color:#17202a;
}
.container{
  max-width:700px;
  margin:auto;
  padding:18px;
}
h1{font-size:32px;margin:10px 0 4px}
.subtitle{color:#667085;margin-bottom:20px}
.card{
  background:white;
  border-radius:18px;
  padding:16px;
  margin:12px 0;
  box-shadow:0 4px 18px rgba(0,0,0,.07);
}
.spot{
  font-size:21px;
  font-weight:700;
}
.coords{
  color:#667085;
  font-size:13px;
}
.wind{
  font-size:30px;
  font-weight:800;
  margin-top:12px;
}
.good{
  color:#159447;
}
.bad{
  color:#b42318;
}
button,a{
  display:inline-block;
  border:0;
  border-radius:11px;
  padding:10px 14px;
  background:#17202a;
  color:white;
  text-decoration:none;
  font-weight:700;
  margin-top:10px;
}
input{
  width:65px;
  padding:8px;
  border:1px solid #ccd3da;
  border-radius:8px;
  font-size:16px;
}
.hour{
  display:inline-block;
  width:110px;
  background:#f4f7f9;
  border-radius:12px;
  padding:9px;
  margin:5px;
  text-align:center;
  font-size:13px;
}
.hour b{
  display:block;
  font-size:17px;
  margin:5px 0;
}
.status{
  padding:10px;
  border-radius:10px;
  background:#f0f4f7;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>🌬 Wind Alert</h1>
<div class="subtitle">
Прогноз ветра для wingfoil / windsurf / kitesurf
</div>

<div class="card">
<b>Порог хорошего ветра:</b>
<input id="threshold" type="number" value="5" step="0.5"> м/с
<br>
<button onclick="loadForecast()">🔄 Обновить прогноз</button>
</div>

<div id="spots"></div>

</div>

<script>

const spots = [

{
name:"Щёлкино",
lat:45.424,
lon:35.817
},

{
name:"Оленевка",
lat:45.372,
lon:32.533
},

{
name:"Межводное",
lat:45.587,
lon:32.845
},

{
name:"Севастополь",
lat:44.617,
lon:33.525
},

{
name:"Должанская",
lat:46.633,
lon:37.805
},

{
name:"Веселовка",
lat:45.113,
lon:36.956
},

{
name:"Анапа",
lat:44.895,
lon:37.316
},

{
name:"Геленджик",
lat:44.562,
lon:38.076
}

];

function direction(deg){

const dirs=[
"N","NE","E","SE",
"S","SW","W","NW"
];

return dirs[Math.round(deg/45)%8];

}

async function getForecast(spot){

const url =
`https://api.open-meteo.com/v1/forecast?latitude=${spot.lat}&longitude=${spot.lon}&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m&forecast_days=3&timezone=auto`;

const response=await fetch(url);

return await response.json();

}

async function showSpot(spot){

const box=document.createElement("div");

box.className="card";

box.innerHTML=`

<div class="spot">
${spot.name}
</div>

<div class="coords">
${spot.lat.toFixed(3)}, ${spot.lon.toFixed(3)}
</div>

<div class="status">
Загрузка прогноза...
</div>

`;

document.getElementById("spots").appendChild(box);

try{

const data=await getForecast(spot);

const threshold=
parseFloat(document.getElementById("threshold").value);

const h=data.hourly;

let html="";

let good=false;

for(let i=0;i<12;i++){

const wind=h.wind_speed_10m[i];

if(wind>=threshold) good=true;

html+=`

<div class="hour">

${new Date(h.time[i]).toLocaleString(
"ru-RU",
{
weekday:"short",
hour:"2-digit",
minute:"2-digit"
}
)}

<b class="${wind>=threshold?'good':'bad'}">
${wind.toFixed(1)} м/с
</b>

${direction(h.wind_direction_10m[i])}

<br>

порывы ${h.wind_gusts_10m[i].toFixed(1)}

</div>

`;

}

box.querySelector(".status").innerHTML =

good

? `<span class="good">
🟢 В ближайшие часы есть ветер от ${threshold} м/с
</span>`

: `<span class="bad">
⚪ В ближайшие часы ветер ниже ${threshold} м/с
</span>`;

box.innerHTML+=html;

box.innerHTML+=`

<br>

<a target="_blank"
href="https://www.windy.com/${spot.lat},${spot.lon},12">
🌐 Открыть Windy
</a>

`;

}catch(error){

box.querySelector(".status").innerHTML=
"❌ Не удалось получить прогноз";

}

}

async function loadForecast(){

document.getElementById("spots").innerHTML="";

for(const spot of spots){

showSpot(spot);

}

}

loadForecast();

</script>

</body>
</html>
